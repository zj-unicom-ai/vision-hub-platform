# Vision Hub Platform - All-in-one Docker Compose deployment.
# Includes: frontend (nginx), web API, media service, MySQL, Redis, Kafka, MinIO.
#
# Usage:
#   1. Copy/adjust passwords and ports in .env (defaults use ZJ_Unicom).
#   2. docker compose up -d --build
#
# All persistent data is stored in named volumes (and ./data, ./logs bind mounts).

services:
  mysql:
    image: mysql:8.4
    container_name: vision-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/vision-hub-web/vision-hub-web-server/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vision-hub-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: vision-hub-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed cluster id so restarts reuse the formatted storage volume.
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      TZ: Asia/Shanghai
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: vision-hub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: vision-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set download "local/$$MINIO_BUCKET"
    restart: "no"

  vision-hub-web-server:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: vision-hub-web/vision-hub-web-server
        JAR_FILE: vision-hub-web-server-1.0.0.jar
    image: vision-hub-web-server:latest
    container_name: vision-hub-web-server
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${WEB_JAVA_OPTS}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: vision-hub-web
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_CDN: ${MINIO_CDN}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WEB_BASE_URL: http://vision-hub-web-server:18080
      MEDIA_BASE_URL: http://vision-hub-media-server:18081
    ports:
      - "${WEB_EXTERNAL_PORT:-18080}:18080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  vision-hub-media-server:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: vision-hub-media/vision-hub-media-server
        JAR_FILE: vision-hub-media-server-1.0.0.jar
    image: vision-hub-media-server:latest
    container_name: vision-hub-media-server
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${MEDIA_JAVA_OPTS}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WEB_BASE_URL: http://vision-hub-web-server:18080
      MEDIA_SNAPSHOT_DIR: /data/vision-hub/snapshots
      MEDIA_STREAM_CHECK_TIMEOUT_MS: 10000
    volumes:
      - ./data/media-snapshots:/data/vision-hub/snapshots
    ports:
      - "${MEDIA_EXTERNAL_PORT:-18081}:18081"
    restart: unless-stopped

  vision-hub-frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: vision-hub-frontend:latest
    container_name: vision-hub-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - vision-hub-web-server
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  minio_data:
