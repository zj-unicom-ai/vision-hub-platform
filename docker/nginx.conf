server {
    listen 80;
    server_name _;

    # Allow image/video uploads from the console.
    client_max_body_size 100m;

    resolver 127.0.0.11 valid=10s;

    # Backend API (all controllers are mapped under /api).
    location /api/ {
        set $backend http://vision-hub-web-server:18080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger UI served by the backend.
    location /swagger-ui {
        set $backend http://vision-hub-web-server:18080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        set $backend http://vision-hub-web-server:18080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Public file access through the same frontend origin.
    # Backend returns URLs like /minio/<bucket>/<object>; nginx rewrites them
    # to MinIO path-style URLs: /<bucket>/<object>.
    location /minio/ {
        set $minio http://minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue SPA with history-mode routing.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
